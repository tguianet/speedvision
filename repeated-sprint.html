<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repeated Sprint</title><style>
body{margin:0;background:#0b0d10;color:#fff;font-family:system-ui}.wrap{max-width:800px;margin:auto;padding:16px}input,button{padding:11px;border-radius:10px;border:1px solid #2c3440;background:#15191f;color:#fff;font:inherit}button{font-weight:800}.card{background:#15191f;border:1px solid #2c3440;border-radius:14px;padding:14px;margin-top:12px}.big{font-size:28px;font-weight:900}</style></head><body><div class="wrap"><h1>Repeated Sprint</h1><p>Digite os tempos capturados pelo SpeedVision para uma série. Depois vamos ligar automaticamente ao módulo de sprint.</p><input id="time" type="number" step=".001" placeholder="Tempo em segundos"><button id="add">ADICIONAR</button><div class="card"><div id="list">Nenhum sprint</div><div>Melhor: <b id="best">—</b></div><div>Média: <b id="avg">—</b></div><div>Queda: <b id="drop" class="big">—</b></div></div></div><script>
let arr=[];const t=document.querySelector('#time');document.querySelector('#add').onclick=()=>{const v=Number(t.value);if(!(v>0))return;arr.push(v);const best=Math.min(...arr),avg=arr.reduce((a,b)=>a+b,0)/arr.length,last=arr[arr.length-1],drop=((last-best)/best)*100;document.querySelector('#list').textContent=arr.map((x,i)=>`${i+1}: ${x.toFixed(3)} s`).join(' | ');document.querySelector('#best').textContent=best.toFixed(3)+' s';document.querySelector('#avg').textContent=avg.toFixed(3)+' s';document.querySelector('#drop').textContent=drop.toFixed(1)+'%';t.value=''};</script></body></html>
