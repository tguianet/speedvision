<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgilityVision</title><style>
body{margin:0;background:#0b0d10;color:#fff;font-family:system-ui}.wrap{max-width:900px;margin:auto;padding:16px}.box{height:220px;background:#15191f;border:1px solid #2c3440;border-radius:14px;position:relative;margin:14px 0}.line{position:absolute;top:0;bottom:0;width:3px}.a{left:15%;background:#facc15}.b{left:50%;background:#22c55e}.c{left:85%;background:#60a5fa}button{padding:12px 16px;border:0;border-radius:10px;font-weight:800;margin-right:8px}.big{font-size:34px;font-weight:900}</style></head><body><div class="wrap"><h1>AgilityVision</h1><p>MVP do teste lateral A → B → C → B → A.</p><div class="box"><div class="line a"></div><div class="line b"></div><div class="line c"></div></div><button id="start">INICIAR SIMULAÇÃO</button><div class="big" id="out">—</div><p>Próxima etapa: ligar estas linhas ao rastreamento real da câmera, como no SpeedVision.</p></div><script>document.querySelector('#start').onclick=()=>{const t=performance.now();document.querySelector('#out').textContent='Teste armado';setTimeout(()=>document.querySelector('#out').textContent=((performance.now()-t)/1000).toFixed(2).replace('.',',')+' s',3200)};</script></body></html>
