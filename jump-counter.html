<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jump Counter</title><style>
body{margin:0;background:#0b0d10;color:#fff;font-family:system-ui}.wrap{max-width:900px;margin:auto;padding:16px}video{width:100%;background:#000;border-radius:14px}button{padding:12px 16px;border:0;border-radius:10px;font-weight:800;margin:10px 8px 10px 0}.card{background:#15191f;border:1px solid #2c3440;border-radius:14px;padding:14px}.n{font-size:52px;font-weight:900}</style></head><body><div class="wrap"><h1>Jump Counter</h1><video id="v" playsinline muted></video><div><button id="cam">ABRIR CÂMERA</button><button id="reset">ZERAR</button></div><div class="card">Saltos<div id="count" class="n">0</div><div id="status">Calibrando posição em pé...</div></div></div>
<script type="module">
import{PoseLandmarker,FilesetResolver}from"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/+esm";
const v=document.querySelector('#v'),countEl=document.querySelector('#count'),status=document.querySelector('#status');let count=0,base=null,inAir=false,samples=[],pose;
const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm");pose=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"},runningMode:"VIDEO"});
document.querySelector('#cam').onclick=async()=>{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});v.srcObject=s;await v.play();loop()};document.querySelector('#reset').onclick=()=>{count=0;base=null;samples=[];inAir=false;countEl.textContent='0'};
function y(l){if(!l||l.length<25)return null;return(l[23].y+l[24].y)/2}
function loop(){const r=pose.detectForVideo(v,performance.now());const hip=y(r.landmarks?.[0]);if(hip!=null){if(base==null){samples.push(hip);if(samples.length>=45){base=samples.reduce((a,b)=>a+b,0)/samples.length;status.textContent='Pronto'}}else{const up=base-hip;if(!inAir&&up>.055){inAir=true;status.textContent='No ar'}if(inAir&&up<.025){inAir=false;count++;countEl.textContent=count;status.textContent='Salto contado'}}}requestAnimationFrame(loop)}</script></body></html>
