<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AsymmetryVision</title><style>
body{margin:0;background:#0b0d10;color:#fff;font-family:system-ui}.wrap{max-width:900px;margin:auto;padding:16px}video{width:100%;background:#000;border-radius:14px}button{padding:12px 16px;border:0;border-radius:10px;font-weight:800;margin:10px 0}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.card{background:#15191f;border:1px solid #2c3440;border-radius:14px;padding:14px}.big{font-size:26px;font-weight:900}</style></head><body><div class="wrap"><h1>AsymmetryVision</h1><video id="v" playsinline muted></video><button id="cam">ABRIR CÂMERA</button><div class="stats"><div class="card">Joelho E<div id="l" class="big">—</div></div><div class="card">Joelho D<div id="r" class="big">—</div></div><div class="card">Diferença<div id="d" class="big">—</div></div></div></div>
<script type="module">
import{PoseLandmarker,FilesetResolver}from"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/+esm";const v=document.querySelector('#v');let pose;
const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm");pose=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task"},runningMode:"VIDEO"});
document.querySelector('#cam').onclick=async()=>{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});v.srcObject=s;await v.play();loop()};
function ang(a,b,c){const u={x:a.x-b.x,y:a.y-b.y},w={x:c.x-b.x,y:c.y-b.y};const dot=u.x*w.x+u.y*w.y,nu=Math.hypot(u.x,u.y),nw=Math.hypot(w.x,w.y);return Math.acos(Math.max(-1,Math.min(1,dot/(nu*nw))))*180/Math.PI}
function loop(){const m=pose.detectForVideo(v,performance.now()).landmarks?.[0];if(m){const L=ang(m[23],m[25],m[27]),R=ang(m[24],m[26],m[28]),D=Math.abs(L-R);document.querySelector('#l').textContent=L.toFixed(1)+'°';document.querySelector('#r').textContent=R.toFixed(1)+'°';document.querySelector('#d').textContent=D.toFixed(1)+'°'}requestAnimationFrame(loop)}</script></body></html>
