<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReactionVision</title><style>
body{margin:0;background:#0b0d10;color:#fff;font-family:system-ui}.wrap{max-width:900px;margin:auto;padding:16px}video{width:100%;background:#000;border-radius:14px}.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}button{padding:12px 16px;border:0;border-radius:10px;font-weight:800}.go{background:#22c55e}.wait{background:#f59e0b}.card{background:#15191f;border:1px solid #2c3440;border-radius:14px;padding:14px;margin-top:12px}.big{font-size:34px;font-weight:900}</style></head><body><div class="wrap"><h1>ReactionVision</h1><video id="v" playsinline muted></video><div class="row"><button id="cam">ABRIR CÂMERA</button><button id="start" disabled>INICIAR TESTE</button></div><div id="stim" class="card"><div id="label">Aguardando</div><div id="out" class="big">—</div></div></div>
<script type="module">
import{PoseLandmarker,FilesetResolver}from"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/+esm";
const v=document.querySelector('#v'),cam=document.querySelector('#cam'),start=document.querySelector('#start'),label=document.querySelector('#label'),out=document.querySelector('#out');
let pose,stream,active=false,baseline=null,stimT=0;
const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm");
pose=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"},runningMode:"VIDEO",numPoses:1});start.disabled=false;
cam.onclick=async()=>{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});v.srcObject=stream;await v.play();loop()};
function anchor(l){if(!l||l.length<25)return null;return{x:(l[23].x+l[24].x)/2,y:(l[23].y+l[24].y)/2}}
start.onclick=()=>{active=false;baseline=null;out.textContent='—';label.textContent='Fique parado...';setTimeout(()=>{label.textContent='VAI!';label.parentElement.className='card go';stimT=performance.now();active=true},1500+Math.random()*2500)};
function loop(){const t=performance.now();const r=pose.detectForVideo(v,t);const a=anchor(r.landmarks?.[0]);if(a){if(!baseline)baseline=a;if(active&&Math.hypot(a.x-baseline.x,a.y-baseline.y)>.025){out.textContent=((performance.now()-stimT)/1000).toFixed(3).replace('.',',')+' s';label.textContent='Reação detectada';active=false}}requestAnimationFrame(loop)}</script></body></html>
