<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vertical Jump</title><style>
body{margin:0;background:#0b0d10;color:#fff;font-family:system-ui}.wrap{max-width:900px;margin:auto;padding:16px}video{width:100%;background:#000;border-radius:14px}button{padding:12px 16px;border:0;border-radius:10px;font-weight:800;margin:10px 8px 10px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#15191f;border:1px solid #2c3440;border-radius:14px;padding:14px}.big{font-size:30px;font-weight:900}</style></head><body><div class="wrap"><h1>Vertical Jump</h1><video id="v" playsinline muted></video><button id="cam">ABRIR CÂMERA</button><button id="reset">NOVO SALTO</button><div class="stats"><div class="card">Tempo de voo<div id="flight" class="big">—</div></div><div class="card">Altura estimada<div id="height" class="big">—</div></div></div><p>Estimativa inicial baseada no tempo de voo. Vamos calibrar depois com vídeos reais.</p></div>
<script type="module">
import{PoseLandmarker,FilesetResolver}from"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/+esm";
const v=document.querySelector('#v'),flight=document.querySelector('#flight'),height=document.querySelector('#height');let pose,base=null,samples=[],air=false,t0=0,done=false;
const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm");pose=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"},runningMode:"VIDEO"});
document.querySelector('#cam').onclick=async()=>{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});v.srcObject=s;await v.play();loop()};document.querySelector('#reset').onclick=()=>{base=null;samples=[];air=false;done=false;flight.textContent=height.textContent='—'};
function hipY(l){if(!l||l.length<25)return null;return(l[23].y+l[24].y)/2}
function loop(){const now=performance.now(),r=pose.detectForVideo(v,now),y=hipY(r.landmarks?.[0]);if(y!=null&&!done){if(base==null){samples.push(y);if(samples.length>=45)base=samples.reduce((a,b)=>a+b,0)/samples.length}else{const up=base-y;if(!air&&up>.05){air=true;t0=now}if(air&&up<.02){air=false;done=true;const sec=(now-t0)/1000;const h=9.80665*sec*sec/8;flight.textContent=sec.toFixed(3).replace('.',',')+' s';height.textContent=(h*100).toFixed(1).replace('.',',')+' cm'}}}requestAnimationFrame(loop)}</script></body></html>
